[package]
name = "mundane-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json="1"
dirs="6"
tempfile="3"
gpui.workspace = true
anyhow.workspace = true
regex = "1"
url = "2"
alacritty_terminal.workspace = true
mundane-ui = { path = "../../crates/mundane-ui" }
mundane-services = { path = "../../crates/mundane-services", features = ["terminal"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[[example]]
name = "header-pointer"
path = "../../tests/wayland/pointer.rs"

[dependencies.accesskit]
version = "0.24.1"

[[example]]
name = "accessible-fields"
path = "../../tests/wayland/accessible_fields.rs"
