[workspace]
members = ["apps/files", "apps/system-monitor", "apps/terminal", "apps/text-editor", "crates/mundane-ui", "crates/mundane-services"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "deb48ceb47125223df73902d1c3b72f2f442222b", default-features = false, features = ["wayland"] }
gpui_linux = { git = "https://github.com/zed-industries/zed", rev = "deb48ceb47125223df73902d1c3b72f2f442222b", default-features = false, features = ["wayland"] }
anyhow = "1"
async-channel = "2"
alacritty_terminal = { version = "0.26", default-features = false }

[profile.dev]
debug = 0
