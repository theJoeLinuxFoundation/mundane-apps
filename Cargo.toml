[workspace]
members = ["apps/archive-manager", "apps/calculator", "apps/disk-usage", "apps/document-viewer", "apps/files", "apps/image-viewer", "apps/music", "apps/packages", "apps/system-monitor", "apps/terminal", "apps/video", "apps/text-editor", "crates/mundane-ui", "crates/mundane-services"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "f4fe0be1f8c7974db07e01c5cd05bee0cf4eb8d9", default-features = false, features = ["wayland"] }
gpui_linux = { git = "https://github.com/zed-industries/zed", rev = "f4fe0be1f8c7974db07e01c5cd05bee0cf4eb8d9", default-features = false, features = ["wayland"] }
anyhow = "1"
async-channel = "2"
alacritty_terminal = { version = "0.26", default-features = false }

[profile.dev]
debug = 0
