[package]
name = "mundane-services"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dirs = {version="6", optional=true}
curl = { version = "0.4", default-features = false, optional = true }
httpdate = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-zoneinfo"], optional = true }
zbus = { version = "5.19", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
anyhow = { workspace = true, optional = true }
gstreamer = { version = "0.25", features = ["v1_22"], optional = true }
gstreamer-app = { version = "0.25", features = ["v1_22"], optional = true }
gstreamer-video = { version = "0.25", features = ["v1_22"], optional = true }
async-channel = { workspace = true, optional = true }
alacritty_terminal = { workspace = true, optional = true }

ashpd = { version = "0.13", default-features = false, features = ["async-io", "open_uri"], optional = true }
freedesktop-icons = { version = "0.4", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
md-5 = { version = "0.10", optional = true }
mime_guess = { version = "2", optional = true }
png = { version = "0.18", optional = true }
rustix = { version = "1", features = ["fs"], optional = true }
tempfile = { version = "3", optional = true }
url = { version = "2", optional = true }

[features]
provider = ["dep:curl", "dep:httpdate", "dep:sha2", "dep:url", "dep:tempfile", "dep:serde", "dep:serde_json", "dep:anyhow"]
weather = ["provider", "dep:jiff"]
clocks = ["dep:jiff", "dep:zbus", "dep:anyhow", "dep:tempfile", "dep:rustix", "rustix/time"]
disks = ["dep:zbus", "dep:anyhow"]
usage = ["dep:rustix", "rustix/process"]
archive = ["dep:anyhow", "dep:tempfile", "dep:rustix"]
test-audio = ["video"]
packages = ["dep:anyhow", "dep:serde", "dep:serde_json"]
video = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video", "dep:anyhow", "dep:rustix", "dep:async-channel"]
monitor = ["dep:rustix", "rustix/param", "rustix/process"]
files = ["dep:dirs", "dep:jiff", "dep:ashpd", "dep:freedesktop-icons", "dep:image", "dep:md-5", "dep:mime_guess", "dep:png", "dep:rustix", "dep:tempfile", "dep:url"]
terminal = ["dep:alacritty_terminal", "dep:async-channel"]

[dev-dependencies]
tempfile = "3"
