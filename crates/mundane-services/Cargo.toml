[package]
name = "mundane-services"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-channel = { workspace = true, optional = true }
alacritty_terminal = { workspace = true, optional = true }

ashpd = { version = "0.13", default-features = false, features = ["async-io", "open_uri"], optional = true }
freedesktop-icons = { version = "0.4", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
md-5 = { version = "0.10", optional = true }
mime_guess = { version = "2", optional = true }
png = { version = "0.18", optional = true }
rustix = { version = "1", features = ["fs"], optional = true }
tempfile = { version = "3", optional = true }
url = { version = "2", optional = true }

[features]
monitor = ["dep:rustix", "rustix/param", "rustix/process"]
files = ["dep:ashpd", "dep:freedesktop-icons", "dep:image", "dep:md-5", "dep:mime_guess", "dep:png", "dep:rustix", "dep:tempfile", "dep:url"]
terminal = ["dep:alacritty_terminal", "dep:async-channel"]
